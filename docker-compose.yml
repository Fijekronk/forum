version: "3.9"

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: forumuser
      POSTGRES_PASSWORD: forumpass
      POSTGRES_DB: forumdb
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    depends_on:
      - db
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://forumuser:forumpass@db:5432/forumdb

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  pgdata:
