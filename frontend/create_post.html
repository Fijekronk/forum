<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create post</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="postCreate">
        <h3>Create your post</h3><br>
        <label for="post-title">Post title</label><br>
        <textarea id="post-title" name="post_content" rows="1" cols="50" required></textarea><br><br>
        <label for="post-content">Post content</label><br>
        <textarea id="post-content" name="post_content" rows="10" cols="50" required></textarea><br><br>
        <input type="submit" value="Submit">
    </div>

    <p id="postCreateMessage"></p>

    <script src="script.js"></script>
</body>
</html>
